<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <script>
      (function () {
        var h = location.hostname;
        var allowed = h === 'edufiszka.app' || h === 'localhost' || h === '127.0.0.1';
        if (!allowed) location.replace('https://edufiszka.app' + location.pathname + location.search + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFiszka - Gra</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="spotlight"></div>
    <div class="stars"></div>

    <!-- Focused game mode: no navigation, one clearly labelled exit. -->
    <header class="top-bar top-bar--game">
        <div class="top-bar-inner">
            <a href="index.html" id="back-to-menu" class="top-bar-back game-exit"><span aria-hidden="true">&#8592;</span> <span data-i18n="nav.exitGame">Zakoncz gre</span></a>
            <div class="top-bar-actions" id="app-bar-actions"></div>
        </div>
    </header>

    <main class="container game-main" id="main">
        <div class="game-container">
            <!-- Header z timerem i pieniedzmi -->
            <div class="game-header">
                <div class="timer-container">
                    <div class="timer-bar">
                        <div class="timer-fill" id="timer-fill"></div>
                    </div>
                    <span class="timer-text" id="timer-text" role="timer" aria-atomic="true">60s</span>
                </div>

                <!-- Wskaznik trudnosci -->
                <div class="difficulty-indicator" id="difficulty-indicator"></div>

                <!-- Licznik serii -->
                <div class="streak-counter" id="streak-counter"></div>

                <div class="current-money" id="current-money">0 PLN</div>
            </div>

            <!-- Pytanie -->
            <div class="question-container fade-in">
                <p class="question-number" id="question-number">Pytanie 1/10</p>
                <h1 class="question-text" id="question-text" aria-live="polite" data-i18n="game.loading">Ladowanie pytania...</h1>
            </div>

            <!-- Odpowiedzi -->
            <div class="answers-container" id="answers-container" role="group" aria-labelledby="question-text">
                <button class="answer-btn" data-index="0">
                    <span class="answer-letter" aria-hidden="true">A:</span>
                    <span class="answer-text"></span>
                </button>
                <button class="answer-btn" data-index="1">
                    <span class="answer-letter" aria-hidden="true">B:</span>
                    <span class="answer-text"></span>
                </button>
                <button class="answer-btn" data-index="2">
                    <span class="answer-letter" aria-hidden="true">C:</span>
                    <span class="answer-text"></span>
                </button>
                <button class="answer-btn" data-index="3">
                    <span class="answer-letter" aria-hidden="true">D:</span>
                    <span class="answer-text"></span>
                </button>
            </div>

            <!-- Kola ratunkowe -->
            <div class="lifelines-container" role="group" aria-label="Kola ratunkowe" data-i18n-aria-label="shop.lifelines">
                <button class="lifeline-btn" id="lifeline-fifty" title="Usuwa 2 bledne odpowiedzi" data-i18n-title="ll.fiftyTitle">
                    <span>50:50</span>
                    <span class="count" id="fifty-count">x0</span>
                </button>
                <button class="lifeline-btn" id="lifeline-skip" title="Pomija pytanie" data-i18n-title="ll.skipTitle">
                    <span data-i18n="ll.skip">Pomin</span>
                    <span class="count" id="skip-count">x0</span>
                </button>
                <button class="lifeline-btn" id="lifeline-time" title="+30 sekund" data-i18n-title="ll.timeTitle">
                    <span data-i18n="ll.time">+Czas</span>
                    <span class="count" id="time-count">x0</span>
                </button>
            </div>

            <!-- Skroty klawiszowe -->
            <div class="keyboard-hints" id="keyboard-hints">
                <span class="hint" data-i18n="kb.select">A/B/C/D lub 1/2/3/4 - wybor</span>
                <span class="hint" data-i18n="kb.next">Spacja - dalej</span>
                <span class="hint" data-i18n="kb.exit">Esc - wyjscie</span>
            </div>
        </div>
    </main>

    <!-- Overlay z wyjasnieniem -->
    <div class="explanation-overlay" id="explanation-overlay">
        <div class="explanation-box" role="dialog" aria-modal="true" aria-labelledby="explanation-result">
            <p class="explanation-result" id="explanation-result">Poprawna odpowiedz!</p>
            <p class="explanation-money" id="explanation-money">+200 000 PLN</p>

            <div class="correct-answer-box" id="correct-answer-box">
                <span class="correct-answer-label" data-i18n="exp.correctLabel">Poprawna odpowiedz:</span>
                <span class="correct-answer-text" id="correct-answer-text"></span>
            </div>

            <div class="explanation-content" id="explanation-text">
                <h2 class="explanation-title" data-i18n="exp.title">Wyjasnienie:</h2>
                <div class="explanation-body"></div>
            </div>

            <button type="button" class="btn btn-primary" id="next-btn">Nastepne pytanie</button>
        </div>
    </div>

    <!-- Ekran koncowy -->
    <div class="end-screen" id="end-screen">
        <div class="end-content" role="dialog" aria-modal="true" aria-labelledby="end-title">
            <h2 class="end-title" id="end-title">Koniec gry!</h2>
            <p class="end-money" id="end-money">Zdobyles: 0 PLN</p>
            <div class="end-buttons">
                <a href="game.html" class="btn btn-primary" data-i18n="end.playAgain">Zagraj ponownie</a>
                <a href="index.html" class="btn btn-secondary" data-i18n="end.mainMenu">Menu glowne</a>
            </div>
        </div>
    </div>

    <script type="module" src="src/game-entry.ts"></script>
</body>
</html>
