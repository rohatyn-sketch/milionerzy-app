<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <script>
      (function () {
        var h = location.hostname;
        var allowed = h === 'edufiszka.app' || h === 'localhost' || h === '127.0.0.1';
        if (!allowed) location.replace('https://edufiszka.app' + location.pathname + location.search + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFiszka - Postepy</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Przejdz do tresci</a>
    <div class="spotlight"></div>
    <div class="stars"></div>

    <header class="app-bar" id="app-bar"></header>

    <main class="container page" id="main">
        <div class="achievements-container">
            <h1 class="page-title achievements-title" data-i18n="progress.title">Postepy</h1>
            <p class="page-subtitle achievements-subtitle" data-i18n="progress.subtitle">Twoje statystyki, osiagniecia i najlepsze wyniki.</p>

            <section class="section" aria-labelledby="stats-heading">
                <h2 class="section-title" id="stats-heading" data-i18n="progress.statsTitle">Statystyki</h2>
                <dl class="stat-grid stat-grid--4">
                    <div class="stat"><dt data-i18n="money.labelShort">Pieniadze</dt><dd id="money-amount">0 PLN</dd></div>
                    <div class="stat"><dt data-i18n="stats.playedShort">Rozegrane gry</dt><dd id="games-played">0</dd></div>
                    <div class="stat"><dt data-i18n="stats.wonShort">Wygrane</dt><dd id="games-won">0</dd></div>
                    <div class="stat"><dt data-i18n="stats.bestStreakShort">Najlepsza seria</dt><dd id="best-streak">0</dd></div>
                </dl>
            </section>

            <section class="section" aria-labelledby="ach-heading">
                <div class="section-header">
                    <h2 class="section-title" id="ach-heading" data-i18n="ach.title">Osiagniecia</h2>
                    <p class="achievements-stats">
                        <span data-i18n="ach.unlocked">Odblokowane:</span> <strong id="achievements-count">0</strong> / <strong id="achievements-total">13</strong>
                    </p>
                </div>
                <p class="section-desc" data-i18n="ach.subtitle">Odblokuj wszystkie, aby stac sie prawdziwym mistrzem!</p>
                <ul class="achievements-grid" id="achievements-grid"></ul>
            </section>

            <section class="section" aria-labelledby="lb-heading">
                <h2 class="section-title" id="lb-heading" data-i18n="lb.title">Najlepsze wyniki</h2>
                <div id="leaderboard-full"></div>
            </section>

            <p class="ai-disclaimer" data-i18n="ai.disclaimer">AI moze popelniac bledy.</p>
        </div>
    </main>

    <script type="module" src="src/achievements-entry.ts"></script>
</body>
</html>
