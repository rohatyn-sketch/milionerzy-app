<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <script>
      (function () {
        var h = location.hostname;
        var allowed = h === 'edufiszka.app' || h === 'localhost' || h === '127.0.0.1';
        if (!allowed) location.replace('https://edufiszka.app' + location.pathname + location.search + location.hash);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFiszka - Osiagniecia</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Przejdz do tresci</a>
    <div class="spotlight"></div>
    <div class="stars"></div>

    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="index.html" class="top-bar-back" data-i18n="nav.back">&#8592; Powrot do menu</a>
            <div class="top-bar-actions" id="app-bar-actions"></div>
        </div>
    </header>

    <main class="container" id="main">
        <div class="achievements-container">
            <h1 class="achievements-title" data-i18n="ach.title">Osiagniecia</h1>
            <p class="achievements-subtitle" data-i18n="ach.subtitle">Odblokuj wszystkie, aby stac sie prawdziwym mistrzem!</p>

            <div class="achievements-stats">
                <span><span data-i18n="ach.unlocked">Odblokowane:</span> <strong id="achievements-count">0</strong> / <strong id="achievements-total">13</strong></span>
            </div>

            <ul class="achievements-grid" id="achievements-grid"></ul>
        </div>
    </main>

    <script type="module" src="src/achievements-entry.ts"></script>
</body>
</html>
